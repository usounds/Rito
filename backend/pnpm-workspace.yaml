allowBuilds:
  '@atcute/time-ms': true
  '@prisma/client': true
  '@prisma/engines': true
  core-js: true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  workerd: false

# Avoid versions published within the last 24 hours to reduce supply-chain risk.
minimumReleaseAge: 1440

overrides:
  postcss: ">=8.5.10"
  vite: "^8.2.1"
  undici: ">=6.23.0"
  hono: ">=4.12.18"
  fast-uri: ">=3.1.2"
  lodash: ">=4.17.24"
  find-my-way: ">=9.6.1"
  valibot: ">=1.4.2"
  "@hono/node-server": ">=1.19.10"
  "@types/pg": "8.20.0"
