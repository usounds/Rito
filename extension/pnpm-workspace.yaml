allowBuilds:
  esbuild: true
  spawn-sync: true

# Avoid versions published within the last 24 hours to reduce supply-chain risk.
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@atcute/bluesky@4.0.6'
  - '@atcute/multibase@1.2.1'

overrides:
  postcss: ">=8.5.10"
  esbuild: ">=0.28.1"
  uuid: ">=11.1.1"
  tmp: ">=0.2.7"
  shell-quote: "^1.8.4"
  adm-zip: ">=0.6.0"
  brace-expansion: "1.1.17"
